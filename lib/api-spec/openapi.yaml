openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/session:
    get:
      operationId: getSession
      summary: Read the current sign-in and pass
      responses:
        "200":
          description: Current session or signed-out state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
  /auth/signup:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/BadRequest" }
  /auth/signin:
    post:
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/BadRequest" }
  /auth/signout:
    post:
      operationId: signOut
      responses:
        "204": { description: Signed out }
  /passes/demo:
    post:
      operationId: grantDemoPass
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassChoice" }
      responses:
        "200":
          description: Development pass granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/BadRequest" }
  /guide/ideas:
    get:
      security: [{ sessionCookie: [] }]
      operationId: listIdeas
      summary: Read guide ideas
      responses:
        "401": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Ideas from the database
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
  /guide/tips:
    get:
      security: [{ sessionCookie: [] }]
      operationId: listTips
      summary: Read survival tips
      responses:
        "401": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Tips from the database
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tip"
  /guide/prices:
    get:
      security: [{ sessionCookie: [] }]
      operationId: listPriceItems
      summary: Read the price guide
      responses:
        "401": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Price items from the database
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceItem"
  /guide/reports:
    post:
      security: [{ sessionCookie: [] }]
      operationId: createReport
      summary: Save a problem report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReport"
      responses:
        "401": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: Saved report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Idea not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    BadRequest:
      description: Request refused
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: detty_session
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 72 }
    Registration:
      type: object
      additionalProperties: false
      required: [email, emailAgain, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        emailAgain: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 72 }
    PassChoice:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { type: string, enum: [day, week, month] }
    Account:
      type: object
      required: [id, email, emailVerified, isAdmin]
      properties:
        id: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        isAdmin: { type: boolean, description: Server-managed free guide access; never accepted during signup }
    AccessPass:
      type: object
      required: [id, plan, startsAt, expiresAt, source]
      properties:
        id: { type: string }
        plan: { type: string, enum: [day, week, month] }
        startsAt: { type: string }
        expiresAt: { type: string }
        source: { type: string }
    SessionInfo:
      type: object
      required: [user, pass, demoPayments, supportWhatsappUrl]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/Account"
            - { type: "null" }
        pass:
          oneOf:
            - $ref: "#/components/schemas/AccessPass"
            - { type: "null" }
        demoPayments: { type: boolean }
        supportWhatsappUrl: { type: ["string", "null"] }
    Idea:
      type: object
      required: [id, city, category, title, area, priceLevel, blurb, verified, status, source]
      properties:
        id: { type: string }
        city: { type: string, enum: [Lagos, Abuja] }
        category: { type: string, enum: [Coffee, Parties, Sports, Events] }
        title: { type: string }
        area: { type: string }
        priceLevel: { type: string }
        blurb: { type: string }
        seller: { type: string }
        verified: { type: string, description: Display text from date_checked, including bracketed sample dates }
        status: { type: string }
        source: { type: string }
    Tip:
      type: object
      required: [id, category, title, body]
      properties:
        id: { type: string }
        category: { type: string, enum: [Scams, Money, Transport, Safety, Health] }
        title: { type: string }
        body: { type: string }
    PriceItem:
      type: object
      required: [id, item, price, lastChecked]
      properties:
        id: { type: string }
        item: { type: string }
        price: { type: string }
        lastChecked: { type: string }
    NewReport:
      type: object
      additionalProperties: false
      required: [ideaId, note]
      properties:
        ideaId: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string, minLength: 1, maxLength: 2000 }
    Report:
      type: object
      required: [id, ideaId, note, createdAt]
      properties:
        id: { type: string }
        ideaId: { type: string }
        note: { type: string }
        createdAt: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

